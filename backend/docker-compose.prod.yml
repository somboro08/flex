version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flex-api-prod
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SERVER_HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=postgres://flex:${DB_PASSWORD}@postgres:5432/flex_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
      - CORS_ALLOWED_ORIGINS=https://flex.bj,https://api.flex.bj
      - MTN_MOMO_API_KEY=${MTN_MOMO_API_KEY}
      - MTN_MOMO_API_SECRET=${MTN_MOMO_API_SECRET}
    volumes:
      - uploads_data:/app/uploads
      - ./web:/app/web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flex-network

  postgres:
    image: postgres:16-alpine
    container_name: flex-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: flex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: flex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flex -d flex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flex-network

  redis:
    image: redis:7-alpine
    container_name: flex-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - flex-network

  caddy:
    image: caddy:2-alpine
    container_name: flex-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - flex-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  flex-network:
    driver: bridge
