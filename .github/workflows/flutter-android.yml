name: Flutter Android CI

on:
  push:
    branches:
      - main
      - chore/configurable-api-environments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Flutter project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin Java to a version supported by the project's Gradle 8.x wrapper.
      # Do not inherit the runner's moving default JDK version.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      # Force Flutter/Gradle to use the same pinned JDK.
      - name: Configure Flutter JDK
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Verify Flutter Java configuration
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://flex-1wlr.onrender.com/api/v1' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is empty. Configure it in GitHub repository Variables."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::Android production builds require an HTTPS API_BASE_URL."; exit 1 ;;
          esac
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flex-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
