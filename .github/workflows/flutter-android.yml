name: Flutter Android CI

on:
  push:
    branches:
      - main
      - chore/configurable-api-environments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Flutter project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://flex-1wlr.onrender.com/api/v1' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is empty. Configure it in GitHub repository Variables."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::Android production builds require an HTTPS API_BASE_URL."; exit 1 ;;
          esac
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flex-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
